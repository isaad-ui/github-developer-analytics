<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark background with rounded corners -->
  <rect width="64" height="64" rx="14" fill="#0D1117"/>

  <!-- Bar 1 — dark green, tallest left -->
  <rect x="8" y="30" width="11" height="22" rx="3" fill="#2D6A4F"/>

  <!-- Bar 2 — green, tallest center-left -->
  <rect x="22" y="20" width="11" height="32" rx="3" fill="#2EA043"/>

  <!-- Bar 3 — medium green, center-right (slightly shorter) -->
  <rect x="36" y="26" width="11" height="26" rx="3" fill="#3FB950"/>

  <!-- Bar 4 — purple/blue, right -->
  <rect x="50" y="34" width="0" height="0" rx="3" fill="#7C3AED"/>

  <!-- Line chart overlay — dots and connecting lines -->
  <!-- Points: (13,27) → (27,16) → (41,22) → (54,12) -->
  <polyline
    points="13,27 27,16 41,22 54,12"
    stroke="#58A6FF"
    stroke-width="2"
    stroke-linejoin="round"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Dot 1 -->
  <circle cx="13" cy="27" r="3.5" fill="#0D1117" stroke="#58A6FF" stroke-width="2"/>
  <!-- Dot 2 — larger, highlighted -->
  <circle cx="27" cy="16" r="4.5" fill="#0D1117" stroke="#58A6FF" stroke-width="2.5"/>
  <!-- Dot 3 -->
  <circle cx="41" cy="22" r="3.5" fill="#0D1117" stroke="#58A6FF" stroke-width="2"/>
  <!-- Dot 4 -->
  <circle cx="54" cy="12" r="3.5" fill="#0D1117" stroke="#58A6FF" stroke-width="2"/>
</svg>
