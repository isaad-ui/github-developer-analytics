name: Deploy website

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────
# NOTE: This workflow deploys the static React frontend only.
#
# The Claude AI features require a separate backend API server
# (see api/ folder). Set VITE_API_URL to the URL of your
# deployed API server. If not set, AI features will attempt to
# connect to http://localhost:3001 (only works locally).
#
# Recommended free hosting for the API: Render or Railway.
# See api/README.md for full setup instructions.
# ─────────────────────────────────────────────────────────────

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: website/package.json

      - name: Install dependencies
        run: npm install
        working-directory: website

      - name: Build
        run: npm run build
        working-directory: website
        env:
          # Set this secret in GitHub → Settings → Secrets → Actions
          # to point the frontend at your deployed API server.
          # Example: https://github-analytics-api.onrender.com
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./website/dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
